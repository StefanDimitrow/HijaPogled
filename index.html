<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
    />
    <title>Хижа Поглед</title>
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="headerImg">
        <img src="./assets/Frame 1.png" alt="Лого на хижа Поглед" />
      </div>
      <div class="headerText">
        Насладете се на прекрасна природа и уютна обстановка при нас! <br />
        Информация за хижата можете да намерите
        <a href="information.html">Тук</a><br />
        За резервации: <a href="contacts.html">Контакти</a>
      </div>
    </header>

    <!-- Navbar -->
    <nav class="navbar">
      <div class="wrapper">
        <a href="#" class="icon facebook">
          <div class="tooltip">Facebook</div>
          <span><i class="fab fa-facebook-f"></i></span>
        </a>
        <a href="#" class="icon instagram">
          <div class="tooltip">Instagram</div>
          <span><i class="fab fa-instagram"></i></span>
        </a>
      </div>
      <div class="navButtonWrapper">
        <a class="navButton" href="index.html">Начало</a>
        <a class="navButton" href="contacts.html">Контакти</a>
        <a class="navButton" href="information.html">Информация</a>
        <a class="navButton" href="gallery.html">Галерия</a>
      </div>
      <label for="search" class="visually-hidden">Търсене</label>
      <input
        id="search"
        class="searchBar"
        type="text"
        placeholder="Търсене..."
      />
    </nav>
    <div class="user">
      <div class="rating-container">
        <h2>Rate this Product</h2>
        <div class="star-rating">
          <span class="star" data-value="1">&#9733;</span>
          <span class="star" data-value="2">&#9733;</span>
          <span class="star" data-value="3">&#9733;</span>
          <span class="star" data-value="4">&#9733;</span>
          <span class="star" data-value="5">&#9733;</span>
        </div>
        <div class="rating-output">
          <p>Your Rating: <span id="rating-output">0</span> / 5</p>
        </div>
      </div>

      <script src="script.js"></script>
      <div class="map-container">
        <iframe
          class="googleMap"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2929.745403886897!2d27.12837187528625!3d42.75143851028696!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40a67bc07d76a70d%3A0x6a340c492d6c59d5!2z0KXQuNC20LAgItCf0L7Qs9C70LXQtCI!5e0!3m2!1sbg!2sbg!4v1737799182565!5m2!1sbg!2sbg"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </div>
    </div>
  </body>
</html>
